<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Auth API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            margin: 10px 5px;
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        .output {
            background: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow-y: auto;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>🧪 Test de Endpoints de Autenticación</h1>
    
    <div>
        <button onclick="testRegister()">1. Registrar Usuario</button>
        <button onclick="testLogin()">2. Login</button>
        <button onclick="testForgotPassword()">3. Forgot Password</button>
        <button onclick="clearOutput()" style="background: #f44336;">Limpiar</button>
    </div>
    
    <div id="output" class="output"></div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let lastToken = null;
        let lastEmail = null;

        function log(message, isError = false) {
            const output = document.getElementById('output');
            const span = document.createElement('div');
            span.className = isError ? 'error' : 'success';
            span.textContent = message;
            output.appendChild(span);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            document.getElementById('output').innerHTML = '';
        }

        async function testRegister() {
            log('\n🧪 Test: Registro de Usuario');
            log('================================');
            
            const userData = {
                username: 'testuser_' + Date.now(),
                password: 'password123',
                name: 'Usuario de Prueba',
                email: 'test' + Date.now() + '@example.com'
            };
            
            log('Enviando: ' + JSON.stringify(userData, null, 2));
            
            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                log('Status: ' + response.status);
                log('Response: ' + JSON.stringify(data, null, 2));
                
                if (response.ok) {
                    log('✅ Registro exitoso');
                    lastToken = data.token;
                    lastEmail = userData.email;
                } else {
                    log('❌ Error: ' + data.message, true);
                }
            } catch (error) {
                log('❌ Error de red: ' + error.message, true);
            }
        }

        async function testLogin() {
            log('\n🧪 Test: Login');
            log('================');
            
            const credentials = {
                username: 'testuser',
                password: 'password123'
            };
            
            log('Enviando: ' + JSON.stringify(credentials, null, 2));
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credentials)
                });
                
                const data = await response.json();
                log('Status: ' + response.status);
                log('Response: ' + JSON.stringify(data, null, 2));
                
                if (response.ok) {
                    log('✅ Login exitoso');
                    lastToken = data.token;
                } else {
                    log('❌ Error: ' + data.message, true);
                }
            } catch (error) {
                log('❌ Error de red: ' + error.message, true);
            }
        }

        async function testForgotPassword() {
            log('\n🧪 Test: Forgot Password');
            log('============================');
            
            const email = lastEmail || 'test@example.com';
            log('Email: ' + email);
            
            try {
                const response = await fetch(`${API_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                log('Status: ' + response.status);
                log('Response: ' + JSON.stringify(data, null, 2));
                
                if (response.ok) {
                    log('✅ Solicitud exitosa');
                    if (data.resetToken) {
                        log('🔑 Reset Token (dev): ' + data.resetToken);
                        log('🔗 URL: http://localhost:5173/reset-password/' + data.resetToken);
                    }
                } else {
                    log('❌ Error: ' + data.message, true);
                }
            } catch (error) {
                log('❌ Error de red: ' + error.message, true);
            }
        }

        // Auto-ejecutar al cargar
        log('✅ Página de tests cargada');
        log('Backend: ' + API_URL);
        log('\nHaz clic en los botones para probar los endpoints\n');
    </script>
</body>
</html>
